# Alembic Configuration File
[alembic]
# path to migration scripts
script_location = alembic
# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s
# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .
# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `python-dateutil` to your requirements.txt.
# Default: system timezone
# timezone = Europe/Paris
# max length of characters to apply to the
# "caverill" trick for getting unresolvable conflict resolution
# between revision numbers.
# Default: 40
# max_xid_chars = 40
# The version table name to be used in the database.
# Default: alembic_version
# version_table = alembic_version
# If set to 'True', the version table will be created as a
# sqlalchemy Table object, rather than the default
# sql.Text().
# version_table_pk = False
# The naming style used to generate SQLAlchemy identifiers from
# names passed to the ``op`` module.
# Default: None
# version_table_schema = None
# The output buffer for revision files will be
# processed by this template string.  If not specified,
# the default is a simple string render.
# If specified, the string is processed through
# the Jinja2 template engine.
# revision_environment = false
# The sentence for the revision id and message in the generated
# migration file heading.  Defaults to:
# "Revision ID: %(rev)s\nRevises: %(down_revision)s\nCreate Date: %(create_date)s"
# rev_id = %(rev)s
# rev_msg = %(rev_msg)s
# When set to 'True', will execute
# ``python -m py_compile revision_<rev>.py`` on .py revision
# files, and
# ``python -m py_compile revision_<rev>.pyc`` on .pyc revision
# files.
# pending_py_compile = false
# SQLAlchemy URL
# This can be a string URL or a key to be looked up in
# the [post-write-hooks] section.
# sqlalchemy.url = driver://user:pass@localhost/dbname
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/kaushalsetu

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s